name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mcp-server:
    name: MCP server (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  skill-scripts:
    name: Skill scripts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests with coverage (old tree)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-exclude="**/__tests__/**"
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90
          "skill/scripts/lib/__tests__/*.test.js"
      - name: Unit tests with coverage (shared)
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-exclude="**/__tests__/**"
          --test-coverage-exclude="shared/scripts/*.js"
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=90
          "shared/scripts/lib/__tests__/*.test.js"

  skill-check:
    name: Skill consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/check-skill.js
      - name: Old tree unchanged on integration branches
        if: github.ref_name != 'master' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          base=$(git merge-base origin/master HEAD)
          git diff --exit-code "$base" HEAD -- skill rules install-claude.sh install-claude.ps1 install-cursor.sh install-cursor.ps1 version.json

  lint-misc:
    name: shellcheck, actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --severity=warning install-claude.sh install-cursor.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
